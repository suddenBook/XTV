name: Build and release XTV

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an exact main branch commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Releases are allowed only from the main branch." >&2
            exit 1
          fi
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          checked_out_commit="$(git rev-parse 'HEAD^{commit}')"
          if [[ "$event_commit" != "$checked_out_commit" ]]; then
            echo "The checked-out commit does not match the triggering commit." >&2
            exit 1
          fi

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17.0.19+10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          cmdline-tools-version: "14742923"
          packages: ""

      - name: Install Android platform and build-tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: Validate operator and release scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            tools/provision.sh \
            tools/phase0/probe.sh \
            tools/inspect-release-apk.sh
          python3 - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path("tools/phase0/sanitize_fixtures.py").read_text(encoding="utf-8"))
          PY

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          version_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ ! "$version_name" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "versionName is missing or is unsafe for a tag and APK filename: $version_name" >&2
            exit 1
          fi
          if [[ ! "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "versionCode must be a positive integer: $version_code" >&2
            exit 1
          fi
          {
            echo "name=$version_name"
            echo "code=$version_code"
            echo "tag=v$version_name"
            echo "apk=XTV-v$version_name.apk"
            echo "mapping=XTV-v$version_name-r8-mapping.txt.gz"
          } >> "$GITHUB_OUTPUT"

      - name: Check release version availability
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TAG"
          git fetch --force --tags origin

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            tag_commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
            event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
            if [[ "$tag_commit" != "$event_commit" ]]; then
              echo "$TAG already points to $tag_commit." >&2
              echo "Bump versionName and versionCode before publishing another commit." >&2
              exit 1
            fi
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists and will not be overwritten." >&2
            echo "Bump versionName and versionCode before publishing another commit." >&2
            exit 1
          fi

      - name: Run unit tests and lint
        shell: bash
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease

      - name: Build minified unsigned release
        shell: bash
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Inspect generated configuration and manifest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t unsigned_apks < <(
            find app/build/outputs/apk/release -maxdepth 1 -type f -name '*release-unsigned.apk'
          )
          if [[ "${#unsigned_apks[@]}" -ne 1 ]]; then
            echo "Expected exactly one unsigned release APK." >&2
            exit 1
          fi
          unsigned_apk="${unsigned_apks[0]}"
          build_tools="$ANDROID_HOME/build-tools/37.0.0"
          bash tools/inspect-release-apk.sh "$unsigned_apk" "$build_tools"

      - name: Package the R8 deobfuscation mapping
        shell: bash
        env:
          MAPPING_NAME: ${{ steps.version.outputs.mapping }}
        run: |
          set -euo pipefail
          mapping="app/build/outputs/mapping/release/mapping.txt"
          [[ -s "$mapping" ]] || {
            echo "The release R8 mapping is missing." >&2
            exit 1
          }
          gzip -n -9 -c "$mapping" > "$MAPPING_NAME"
          sha256sum "$MAPPING_NAME" > "$MAPPING_NAME.sha256"

      - name: Decode signing keystore
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "keystore=$keystore" >> "$GITHUB_OUTPUT"

      - name: Align, sign, verify, and checksum APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore }}
          APK_NAME: ${{ steps.version.outputs.apk }}
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/37.0.0"
          mapfile -t unsigned_apks < <(
            find app/build/outputs/apk/release -maxdepth 1 -type f -name '*release-unsigned.apk'
          )
          if [[ "${#unsigned_apks[@]}" -ne 1 ]]; then
            echo "Expected exactly one unsigned release APK." >&2
            exit 1
          fi
          unsigned_apk="${unsigned_apks[0]}"
          "$build_tools/zipalign" -P 16 -f 4 "$unsigned_apk" "$RUNNER_TEMP/app-release-aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$APK_NAME" \
            "$RUNNER_TEMP/app-release-aligned.apk"
          "$build_tools/zipalign" -c -P 16 4 "$APK_NAME"
          "$build_tools/apksigner" verify --verbose --print-certs "$APK_NAME"
          actual_signer="$(
            "$build_tools/apksigner" verify --print-certs "$APK_NAME" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p'
          )"
          expected_signer="9ebbd0a688de30aedfe6b98a32c16e3d3579733d3581bbbf4de240648233c10b"
          if [[ "${actual_signer,,}" != "$expected_signer" ]]; then
            echo "Release signer does not match the public XTV update lineage." >&2
            exit 1
          fi
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      - name: Remove decoded signing keystore
        if: always()
        shell: bash
        run: |
          keystore="$RUNNER_TEMP/release.keystore"
          if [[ -f "$keystore" ]]; then
            shred -u "$keystore" 2>/dev/null || rm -f -- "$keystore"
          fi

      - name: Attest signed APK provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.version.outputs.apk }}

      - name: Upload verified workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: XTV-v${{ steps.version.outputs.name }}
          path: |
            ${{ steps.version.outputs.apk }}
            ${{ steps.version.outputs.apk }}.sha256
            ${{ steps.version.outputs.mapping }}
            ${{ steps.version.outputs.mapping }}.sha256
          if-no-files-found: error

      - name: Write release notes
        shell: bash
        env:
          APK_NAME: ${{ steps.version.outputs.apk }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse 'HEAD^{commit}')"
          apk_sha256="$(cut -d ' ' -f 1 "$APK_NAME.sha256")"
          # The single-quoted backticks below are intentional Markdown code spans.
          # shellcheck disable=SC2016
          {
            printf 'Automated release for v%s (X TV).\n\n' "$VERSION_NAME"
            printf -- '- Version name: %s\n' "$VERSION_NAME"
            printf -- '- Version code: %s\n' "$VERSION_CODE"
            printf -- '- Commit: `%s`\n' "$commit"
            printf -- '- APK: `%s`\n' "$APK_NAME"
            printf -- '- SHA-256: `%s`\n' "$apk_sha256"
            printf -- '- Signer certificate SHA-256: `9ebbd0a688de30aedfe6b98a32c16e3d3579733d3581bbbf4de240648233c10b`\n'
            printf -- '- Provenance: `gh attestation verify %s --repo %s`\n\n' "$APK_NAME" "$GITHUB_REPOSITORY"
            printf 'The APK contains no X credentials. Provision only over USB or authenticated Wireless Debugging/TLS using `tools/provision.sh`; plaintext legacy `adb tcpip 5555` is rejected.\n\n'
            printf 'Every timeline request is a paid request, quoted before you accept it. The X Developer Console is the only billing control and must have its own hard limit configured before use.\n'
          } > release-notes.md

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APK_NAME: ${{ steps.version.outputs.apk }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG was created while this workflow was building." >&2
            exit 1
          fi

          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" \
              -f "sha=$GITHUB_SHA" \
              >/dev/null
          fi

          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          tag_commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if [[ "$tag_commit" != "$event_commit" ]]; then
            echo "$TAG points to $tag_commit, not the release commit $event_commit." >&2
            exit 1
          fi

          gh release create "$TAG" \
            "$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file release-notes.md \
            --latest
