name: Verify XTV

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, and inspect minified release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17.0.19+10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          cmdline-tools-version: "14742923"
          packages: ""

      - name: Install Android platform and build-tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: Validate operator and release scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            tools/provision.sh \
            tools/phase0/probe.sh \
            tools/inspect-release-apk.sh
          python3 - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path("tools/phase0/sanitize_fixtures.py").read_text(encoding="utf-8"))
          PY

      - name: Run tests and release lint
        shell: bash
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease

      - name: Build minified release candidate
        shell: bash
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Inspect generated configuration and manifest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t unsigned_apks < <(
            find app/build/outputs/apk/release -maxdepth 1 -type f -name '*release-unsigned.apk'
          )
          if [[ "${#unsigned_apks[@]}" -ne 1 ]]; then
            echo "Expected exactly one unsigned release APK." >&2
            exit 1
          fi
          unsigned_apk="${unsigned_apks[0]}"
          build_tools="$ANDROID_HOME/build-tools/37.0.0"
          bash tools/inspect-release-apk.sh "$unsigned_apk" "$build_tools"
          # Named from the build file, not pinned here: a stale literal silently labels the
          # evidence with the wrong version, which is worse than no evidence at all.
          version_name="$(
            sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              app/build.gradle.kts | head -n 1
          )"
          [ -n "$version_name" ] || { echo "Could not read versionName." >&2; exit 1; }
          sha256sum "$unsigned_apk" > "XTV-v${version_name}-unsigned.apk.sha256"
          echo "version=$version_name" >> "$GITHUB_OUTPUT"
        id: inspect

      - name: Upload verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: XTV-v${{ steps.inspect.outputs.version }}-verification
          path: |
            app/build/outputs/apk/release/*release-unsigned.apk
            XTV-v*-unsigned.apk.sha256
            app/build/reports/lint-results-release.html
          if-no-files-found: error
